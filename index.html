<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Background Remover</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Modern 3D Glassmorphism Styles */
    :root {
      --primary: #7c3aed;
      --secondary: #4f46e5;
      --glass: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #0f0c29, #302b63);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow-x: hidden;
    }

    /* Prevent layout shift and improve rendering performance */
    .container, .drop-zone, .image-container, button, select {
      will-change: transform;
    }

    /* Optimize animations for better performance */
    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .container {
      background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 600px;
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
      50% { transform: translateY(-20px) rotateX(3deg) rotateY(2deg); }
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2.5rem;
      background: linear-gradient(45deg, #7c3aed, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .drop-zone {
      border: 2px dashed var(--glass);
      border-radius: 15px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: rgba(255,255,255,0.05);
      margin: 2rem 0;
    }

    .drop-zone:hover {
      border-color: var(--primary);
      background: rgba(125, 58, 237, 0.1);
      transform: translateZ(10px);
    }

    .drop-zone.dragover {
      border-color: #4f46e5;
      background: rgba(79, 70, 229, 0.2);
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--primary);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .image-container {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      margin: 2rem 0;
      transform: translateZ(20px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }

    #uploadedImage, #resultCanvas {
      width: 100%;
      height: auto;
      border-radius: 15px;
      display: none;
      transition: transform 0.3s ease;
    }

    .loader {
      display: none;
      position: relative;
      width: 80px;
      height: 80px;
      margin: 2rem auto;
    }

    .loader:before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--primary);
      border-bottom-color: var(--secondary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .download-options {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }

    button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 1rem 2rem;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(125, 58, 237, 0.3);
    }

    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 32px rgba(125, 58, 237, 0.4);
    }

    select {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass);
      color: white;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      color: white;
      padding: 1rem 2rem;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      display: none;
      animation: slideIn 0.3s ease-out;
      z-index: 1000;
    }

    .toast.success {
      background: rgba(34, 197, 94, 0.9);
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.9);
    }

    .toast.info {
      background: rgba(59, 130, 246, 0.9);
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-magic"></i> Neon Background Remover</h1>
    
    <div class="drop-zone" id="dropZone">
      <div class="upload-icon">
        <i class="fas fa-cloud-upload-alt"></i>
      </div>
      <p>Drag & Drop Your Image<br>or<br>Click to Upload</p>
      <input type="file" id="imageUpload" accept="image/*" hidden />
    </div>

    <div class="loader"></div>

    <div class="image-container">
      <img id="uploadedImage" src="#" alt="Original Image" />
      <canvas id="resultCanvas"></canvas>
    </div>

    <div class="download-options">
      <select id="downloadFormat">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
        <option value="webp">WebP</option>
      </select>
      <button id="downloadButton">
        <i class="fas fa-download"></i> Download
      </button>
    </div>
  </div>

  <script>
    // Optimized JavaScript with performance improvements and bug fixes
    const API_KEY = 'PpDH52N4SyUJDoo3KJmxVhM7';

    // Cache DOM elements for better performance
    const elements = {};
    
    // State management
    let currentImageBlob = null;
    let toastTimeout = null;

    function init() {
      cacheElements();
      setupEventListeners();
    }

    function cacheElements() {
      elements.dropZone = document.getElementById('dropZone');
      elements.imageUpload = document.getElementById('imageUpload');
      elements.uploadedImage = document.getElementById('uploadedImage');
      elements.resultCanvas = document.getElementById('resultCanvas');
      elements.loader = document.querySelector('.loader');
      elements.downloadButton = document.getElementById('downloadButton');
      elements.formatSelector = document.getElementById('downloadFormat');
    }

    function setupEventListeners() {
      elements.dropZone.addEventListener('click', () => elements.imageUpload.click());
      
      // Passive event listeners for better scroll performance
      elements.dropZone.addEventListener('dragover', handleDrag, { passive: false });
      elements.dropZone.addEventListener('dragleave', handleDrag, { passive: false });
      elements.dropZone.addEventListener('drop', handleDrag, { passive: false });

      elements.imageUpload.addEventListener('change', (e) => {
        if (e.target.files?.[0]) {
          handleImageUpload(e.target.files[0]);
        }
      });

      elements.downloadButton.addEventListener('click', handleDownload);
    }

    function handleDrag(e) {
      e.preventDefault();
      e.stopPropagation();

      if (e.type === 'dragover') {
        elements.dropZone.classList.add('dragover');
      } else if (e.type === 'dragleave') {
        elements.dropZone.classList.remove('dragover');
      } else if (e.type === 'drop') {
        elements.dropZone.classList.remove('dragover');
        handleImageUpload(e.dataTransfer.files[0]);
      }
    }

    async function handleImageUpload(file) {
      try {
        if (!file || !file.type.startsWith('image/')) {
          throw new Error('Invalid file type. Please upload an image.');
        }

        // Validate file size (max 10MB for API)
        const maxSize = 10 * 1024 * 1024;
        if (file.size > maxSize) {
          throw new Error('File size exceeds 10MB limit.');
        }

        showPreview(file);

        elements.loader.style.display = 'block';
        elements.downloadButton.style.display = 'none';
        
        const formData = new FormData();
        formData.append('image_file', file);
        formData.append('size', 'auto');

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout

        try {
          const response = await fetch('https://api.remove.bg/v1.0/removebg', {
            method: 'POST',
            headers: { 'X-Api-Key': API_KEY },
            body: formData,
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ errors: [{ title: 'API request failed' }] }));
            throw new Error(errorData.errors?.[0]?.title || `HTTP ${response.status}: Background removal failed`);
          }

          const blob = await response.blob();
          currentImageBlob = blob;
          displayResult(blob);
          showToast('✨ Background removed successfully!', 'success');
        } catch (fetchError) {
          clearTimeout(timeoutId);
          if (fetchError.name === 'AbortError') {
            throw new Error('Request timed out. Please try again.');
          }
          throw fetchError;
        }
      } catch (error) {
        console.error('Upload error:', error);
        showToast(`❌ Error: ${error.message}`, 'error');
      } finally {
        elements.loader.style.display = 'none';
      }
    }

    function showPreview(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        elements.uploadedImage.src = e.target.result;
        elements.uploadedImage.style.display = 'block';
        elements.resultCanvas.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function displayResult(blob) {
      const img = new Image();
      img.onload = () => {
        elements.resultCanvas.width = img.naturalWidth;
        elements.resultCanvas.height = img.naturalHeight;
        const ctx = elements.resultCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        elements.resultCanvas.style.display = 'block';
        elements.downloadButton.style.display = 'inline-block';
      };
      img.onerror = () => {
        showToast('❌ Failed to load processed image', 'error');
      };
      img.src = URL.createObjectURL(blob);
    }

    function handleDownload() {
      if (!currentImageBlob) {
        showToast('❌ No image to download', 'error');
        return;
      }

      const format = elements.formatSelector.value;
      const quality = format === 'jpeg' ? 0.95 : undefined;
      
      elements.resultCanvas.toBlob(blob => {
        if (!blob) {
          showToast('❌ Failed to generate download', 'error');
          return;
        }
        
        const link = document.createElement('a');
        link.download = `background-free.${format}`;
        link.href = URL.createObjectURL(blob);
        link.click();
        
        // Clean up object URL after download
        setTimeout(() => URL.revokeObjectURL(link.href), 100);
      }, `image/${format}`, quality);
    }

    function showToast(message, type = 'info') {
      // Clear any existing toast timeout
      if (toastTimeout) {
        clearTimeout(toastTimeout);
      }

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      // Auto-remove after 3 seconds
      toastTimeout = setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease-out reverse';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Initialize app when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
